<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Site</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; font-size: 28px; color: #111; }
        p { font-size: 16px; color: #666; line-height: 1.6; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            background-color: #0070f3;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #0051a2; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Under Construction</h1>
        <p>Welcome! Something great is cooking here. Check back soon for updates or get in touch via the link below.</p>
        <a href="mailto:your-email@example.com" class="btn">Contact Me</a>
    </div>

</body>
</html>
